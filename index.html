           into its two words. Each word is covered by a curtain the colour
           of the ground; the curtain slides right and the writing appears
           behind it.

           This replaces an svg mask whose dash offset was re-computed every
           frame. A mask forces the browser to rebuild an offscreen buffer
           and recomposite on each tick, which iPhones could not keep up
           with. A curtain moves by transform alone — the one thing every
           compositor does for free — and the letterforms stay exactly as
           they were, because nothing about the mark itself has changed. -->
